[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-one-api"
version = "0.1.0"
description = "Local-first crusher ERP and workforce management API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.15.2",
  "fastapi==0.115.12",
  "pydantic-settings==2.9.1",
  "PyJWT==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "psycopg[binary]==3.2.9",
  "python-dotenv==1.1.0",
  "SQLAlchemy==2.0.41",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
